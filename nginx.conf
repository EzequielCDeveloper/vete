# ─── VetCare — Nginx (nativo en VPS) ─────────────────────────
# Ruta en el VPS: /etc/nginx/sites-available/veterinaria.conf
# Habilitar: ln -s /etc/nginx/sites-available/veterinaria.conf /etc/nginx/sites-enabled/
# ──────────────────────────────────────────────────────────────

upstream vetcare_api {
    server 127.0.0.1:4000;
}

# ─── HTTP → HTTPS ───────────────────────────────────────────
server {
    listen 80;
    server_name veterinaria.ezequielcastellanosleyva.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name veterinaria.ezequielcastellanosleyva.net;

    # ─── SSL ─────────────────────────────────────────────────
    ssl_certificate     /etc/ssl/ezequielcastellanosleyva.net/ezequielcastellanosleyva.net.pem;
    ssl_certificate_key /etc/ssl/ezequielcastellanosleyva.net/ezequielcastellanosleyva.net.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ─── Headers de seguridad ───────────────────────────────
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # ─── Frontend (SPA) — proxy al contenedor frontend ──────
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:3005;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─── API — proxy reversa al backend en Docker ───────────
    location /api/ {
        proxy_pass http://vetcare_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 1m;
    }

    location = /api/health {
        access_log off;
        proxy_pass http://vetcare_api;
    }

    # ─── Rate limiting ───────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req zone=api burst=50 nodelay;

    # ─── Logs ───────────────────────────────────────────────
    access_log /var/log/nginx/vetcare-access.log;
    error_log  /var/log/nginx/vetcare-error.log;
}
