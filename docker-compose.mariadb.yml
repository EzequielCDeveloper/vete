# ─── MariaDB — Docker Compose (producción) ───────────────────
# Corre en la misma red que el backend de VetCare.
# ──────────────────────────────────────────────────────────────

services:
  mariadb:
    image: mariadb:11
    container_name: mariadb_prod
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      # ⚠️ Debe coincidir con DB_NAME del backend
      MARIADB_DATABASE: Veterinaria_pet_land
      MARIADB_USER: mi_usuario_app
      MARIADB_PASSWORD_FILE: /run/secrets/db_password

    secrets:
      - db_root_password
      - db_password

    volumes:
      - mariadb-data:/var/lib/mysql
      - ./my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./init-scripts:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 2G

    # Exposición solo para acceso directo desde el VPS (opcional)
    ports:
      - "127.0.0.1:3306:3306"

    # Misma red que el backend para que DB_HOST: mariadb resuelva
    networks:
      - vetcare-net

secrets:
  db_root_password:
    file: ./secrets/db_root_password.txt
  db_password:
    file: ./secrets/db_password.txt

volumes:
  mariadb-data:

networks:
  vetcare-net:
    external: true
