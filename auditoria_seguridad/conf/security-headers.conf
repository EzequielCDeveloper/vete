# ─────────────────────────────────────────────────────────────
# security-headers.conf — Headers de seguridad para VetCare
# Incluir desde el bloque server del site:
#   include /etc/nginx/snippets/security-headers.conf;
# ─────────────────────────────────────────────────────────────

# ─── HSTS — Strict Transport Security ─────────────────────────
# Obliga al navegador a usar siempre HTTPS.
# max-age=63072000 = 2 años; includeSubDomains; preload
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# ─── Content Security Policy (CSP) ────────────────────────────
# Restringe qué recursos puede cargar el navegador.
# Ajustá las directivas si agregás nuevos CDNs o fuentes.
add_header Content-Security-Policy "
    default-src 'self';
    script-src  'self'
                https://static.cloudflareinsights.com
                https://veterinaria.ezequielcastellanosleyva.net/cdn-cgi/
                'unsafe-inline'
                'strict-dynamic';
    style-src   'self'
                'unsafe-inline';
    img-src     'self'
                data:;
    connect-src 'self'
                https://veterinaria.ezequielcastellanosleyva.net;
    font-src    'self';
    frame-ancestors 'none';
    base-uri    'self';
    form-action 'self';
" always;

# ─── X-Content-Type-Options ──────────────────────────────────
# Evita MIME-sniffing del navegador.
add_header X-Content-Type-Options "nosniff" always;

# ─── X-Frame-Options ─────────────────────────────────────────
# Evita clickjacking.
add_header X-Frame-Options "DENY" always;

# ─── Referrer-Policy ─────────────────────────────────────────
# Controla qué información se envía en el header Referer.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ─── Permissions-Policy ─────────────────────────────────────
# Restringe APIs del navegador (cámara, micrófono, geolocalización).
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
