# ─────────────────────────────────────────────────────────────
# server-hardening.conf — Hardening del servidor nginx
# Incluir desde el bloque http (normalmente /etc/nginx/nginx.conf):
#   include /etc/nginx/snippets/server-hardening.conf;
# ─────────────────────────────────────────────────────────────

# ─── Ocultar versión de nginx ───────────────────────────────
# Evita que atacantes sepan la versión exacta (CVE targeting).
server_tokens off;

# ─── Tamaño máximo de request body ─────────────────────────
# Previene ataques deDoS por payloads grandes.
client_max_body_size 1m;

# ─── Timeouts ──────────────────────────────────────────────
# Previene slow loris attacks y conexiones colgadas.
client_body_timeout   10s;
client_header_timeout 10s;
keepalive_timeout     10s 10s;
send_timeout          10s;

# ─── Buffer sizes ──────────────────────────────────────────
# Previene buffer overflow attacks.
client_body_buffer_size 128k;
client_header_buffer_size 1k;
large_client_header_buffers 4 8k;

# ─── Deshabilitar métodos inseguros ────────────────────────
# Solo permitir GET, HEAD, POST (el API no usa PUT/DELETE directamente).
# Si usás métodos HTTP adicionales, ajustalo.
# (Se aplica por server block normalmente, esto va como referencia)
