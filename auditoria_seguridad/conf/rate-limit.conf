# ─────────────────────────────────────────────────────────────
# rate-limit.conf — Rate limiting compartido
# Incluir desde el bloque http de nginx (una sola vez):
#   include /etc/nginx/snippets/rate-limit.conf;
# ─────────────────────────────────────────────────────────────

# Define la zona de rate limiting compartida.
# api: nombre de la zona (debe coincidir con limit_req en el server block)
# 10m: tamaño de la zona en memoria (almacena ~160k direcciones IP)
# 30r/s: máximo de requests por segundo por IP
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
